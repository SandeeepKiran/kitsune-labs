# Build the site and publish it to GitHub Pages on every push to main.
# Live address: https://sandeeepkiran.github.io/kitsune-labs/
# One-time setup (repo Settings > Pages): set "Source" to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the code, write to Pages, and prove the deploy came from this repo.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Do not cancel a deploy that is half done.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: npm run build

      # The private denylist (docs/private/) is never in the repo. If the owner stored a copy
      # as the PRIVACY_DENYLIST secret, use it; if not, run the pattern rules only and say so.
      # The check prints line numbers, never the terms, so the log stays safe.
      - name: Privacy check (any hit stops the deploy)
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: |
          if [ -n "$PRIVACY_DENYLIST" ]; then
            printf '%s\n' "$PRIVACY_DENYLIST" > "$RUNNER_TEMP/denylist.txt"
            python3 tools/privacy_check.py --denylist "$RUNNER_TEMP/denylist.txt"
          else
            echo "::warning::PRIVACY_DENYLIST secret not set: pattern rules only. The full check runs locally before every commit."
            python3 tools/privacy_check.py --no-denylist
          fi

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
